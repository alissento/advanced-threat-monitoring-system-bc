#--------------------------------------------------------------
# Wazuh Agent DaemonSet
#
# Deployed to: bc-prd EKS cluster, namespace "wazuh"
#
# Reads logs from /var/log on the host (where Suricata and Zeek write).
# Connects to wazuh-manager.bc-ctrl.internal.
#--------------------------------------------------------------
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: wazuh-agent
  namespace: wazuh
  labels:
    app: wazuh-agent
spec:
  selector:
    matchLabels:
      app: wazuh-agent
  template:
    metadata:
      labels:
        app: wazuh-agent
    spec:
      hostNetwork: true
      hostPID: true
      hostIPC: true
      priorityClassName: bc-security-node-critical
      tolerations:
        - effect: NoSchedule
          operator: Exists
      containers:
        - name: wazuh-agent
          image: ${AWS_ACCOUNT_ID}.dkr.ecr.eu-west-1.amazonaws.com/wazuh-agent:4.14.4
          command:
            - /bin/bash
            - -c
            - |
              export WAZUH_AGENT_NAME="eks-prd-${NODE_NAME%%.*}"
              # Force enrollment with the human-readable name to generate client.keys
              rm -f /var/ossec/etc/client.keys
              /var/ossec/bin/agent-auth -m wazuh-manager.bc-ctrl.internal -A $WAZUH_AGENT_NAME || true
              # Start agentd in foreground mode (no daemonize) so wait works
              /var/ossec/bin/wazuh-agentd -f &
              AGENTD_PID=$!
              # Wait up to 120s for the com socket (agentd enrolls, then creates it)
              for i in $(seq 1 60); do
                [ -S /var/ossec/queue/sockets/queue ] && break
                sleep 2
              done
              # Start log collector and module daemon
              /var/ossec/bin/wazuh-logcollector &
              /var/ossec/bin/wazuh-modulesd &
              # Keep container alive; exit if agentd dies
              wait $AGENTD_PID
          securityContext:
            privileged: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: WAZUH_MANAGER
              value: "wazuh-manager.bc-ctrl.internal"
            - name: WAZUH_ENROLLMENT_SERVER
              value: "wazuh-manager.bc-ctrl.internal"
            - name: WAZUH_AGENT_GROUP
              value: "default"
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - mountPath: /var/run
              name: var-run
            - mountPath: /dev
              name: dev
            - mountPath: /host/etc
              name: etc
              readOnly: true
            - mountPath: /host/var/log
              name: var-log
              readOnly: true
            - mountPath: /var/ossec/etc/ossec.conf
              name: agent-config
              subPath: ossec.conf
              readOnly: true
      volumes:
        - name: var-run
          hostPath:
            path: /var/run
        - name: dev
          hostPath:
            path: /dev
        - name: etc
          hostPath:
            path: /etc
        - name: var-log
          hostPath:
            path: /var/log
        - name: agent-config
          configMap:
            name: wazuh-agent-config
